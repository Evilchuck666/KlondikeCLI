name: Deploy project page

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'install.sh'
      - 'install.ps1'
      - '.github/workflows/pages.yaml'
  pull_request:
    paths:
      - 'site/**'
      - 'install.sh'
      - 'install.ps1'
      - '.github/workflows/pages.yaml'
  workflow_dispatch:

permissions:
  contents: read

# The JavaScript actions below run on Node 24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: project-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate project page
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check public files
        shell: bash
        run: |
          test -s site/index.html
          test -s site/styles.css
          test -f site/.nojekyll
          test "$(find site -type f | wc -l)" -eq 5
          test -s site/favicon.svg
          test -s site/assets/screenshots/game.png
      # The installers are published next to the page (see the deploy job).
      - name: Check install scripts
        shell: bash
        run: |
          bash -n install.sh
          shellcheck install.sh
          pwsh -NoProfile -Command '
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Host "install.ps1:$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
            Write-Host "install.ps1 parses cleanly."'

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Add install scripts to the site
        run: cp install.sh install.ps1 site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
